    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
            padding-top: 0;
            margin: 0;
            background: #0f172a;

        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;

        .checking-spinner {

            height: 14px;

        .proxy-item.valid {

        .proxy-item.invalid {
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.05);
            opacity: 0.6;
        }
        .status-badge {

            border-radius: 10px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .status-badge.valid { background: rgba(52, 211, 153, 0.2); color: #34d399; }
        .status-badge.invalid { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .status-badge.checking { background: rgba(96, 165, 250, 0.2); color: #60a5fa; }
        .status-badge.idle { background: rgba(255,255,255,0.05); color: #94a3b8; }

        .clickable-icon {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .clickable-icon:hover { transform: scale(1.05); }
        .clickable-icon:active { transform: scale(0.95); }

        .page-tab {
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid transparent;

        .page-tab.active {
            background: rgba(0, 136, 204, 0.2);
            border-color: rgba(0, 136, 204, 0.4);
            color: #60a5fa;
        }
        .page-tab.inactive {
            color: #64748b;
            border-color: rgba(255,255,255,0.05);
        }
        .page-tab.inactive:hover {
            background: rgba(255,255,255,0.05);
            color: #94a3b8;
        }

        .source-label-clickable {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .source-label-clickable:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.15);
        }
        .source-label-clickable:active { transform: scale(0.95); }

        /* ===== 图片解锁遮罩 ===== */
        #lock-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;

        .image-wrapper {

            max-width: 95vw;

    <script>
        // ================================================================
        //  第一部分：图片连续点击解锁
        // ================================================================
        (function initLock() {
            const REQUIRED_CLICKS = 6;
            const CLICK_TARGET_X = 38;
            const CLICK_TARGET_Y = 8;
            const CLICK_RADIUS = 15;

            let clickCount = 0;
            let clickTimeout = null;

            const overlay = document.getElementById('lock-overlay');
            const mainContent = document.getElementById('main-content');
            const imageWrapper = document.getElementById('imageWrapper');

            function isInTarget(e) {
                const rect = imageWrapper.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width * 100);
                const y = ((e.clientY - rect.top) / rect.height * 100);
                const dist = Math.sqrt((x - CLICK_TARGET_X) ** 2 + (y - CLICK_TARGET_Y) ** 2);
                return dist <= CLICK_RADIUS;
            }

            function handleImageClick(e) {
                if (!isInTarget(e)) return;

                const rect = imageWrapper.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const ripple = document.createElement('div');
                ripple.className = 'ripple';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                ripple.style.width = '30px';
                ripple.style.height = '30px';
                ripple.style.marginLeft = '-15px';
                ripple.style.marginTop = '-15px';
                imageWrapper.appendChild(ripple);
                setTimeout(() => ripple.remove(), 500);

                clickCount++;

                if (clickCount >= REQUIRED_CLICKS) {
                    overlay.classList.add('hidden');
                    mainContent.style.display = 'flex';
                    setTimeout(() => {
                        if (typeof initApp === 'function') initApp();
                    }, 100);
                    return;
                }

                clearTimeout(clickTimeout);
                clickTimeout = setTimeout(() => { clickCount = 0; }, 2000);
            }

            imageWrapper.addEventListener('click', handleImageClick);
            imageWrapper.addEventListener('touchstart', function(e) {
                const touch = e.touches[0];
                handleImageClick({ clientX: touch.clientX, clientY: touch.clientY });
                e.preventDefault();
            }, { passive: false });
        })();


        // ================================================================
        //  第二部分：代理页面逻辑
        // ================================================================
        function initApp() {
            const DATA_SOURCES = {
                local: {
                    url: 'proxy.txt',
                    label: '📡 数据源: 本地'
                },
                github: {
                    url: 'https://gh-proxy.org/https://raw.githubusercontent.com/watchttvv/free-proxy-list/refs/heads/main/proxy.txt',
                    label: '📡 数据源: GitHub (备用)'
                }
            };

            let currentSource = 'local';
            let currentPage = 'socks5';
            let proxyItems = [];
            let isCheckingAll = false;

            const tabSocks5 = document.getElementById('pageTabSocks5');
            const tabHttp = document.getElementById('pageTabHttp');
            const tabMtproto = document.getElementById('pageTabMtproto');
            const sourceLabel = document.getElementById('dataSourceLabel');
            const switchPageBtn = document.getElementById('switchPage');

            // ==================== 切换页面 ====================
            function switchPage(page) {
                if (page === currentPage) return;
                currentPage = page;
                tabSocks5.className = `page-tab ${page === 'socks5' ? 'active' : 'inactive'}`;
                tabHttp.className = `page-tab ${page === 'http' ? 'active' : 'inactive'}`;
                tabMtproto.className = `page-tab ${page === 'mtproto' ? 'active' : 'inactive'}`;
                fetchProxies();
                showToast(`📄 切换到 ${page === 'socks5' ? 'SOCKS5' : page === 'http' ? 'HTTP' : 'MTProto'} 列表`);
            }

            // ==================== 切换数据源 ====================
            function switchDataSource() {
                currentSource = currentSource === 'local' ? 'github' : 'local';
                sourceLabel.textContent = DATA_SOURCES[currentSource].label;
                fetchProxies();
                showToast(`🔄 已切换到 ${DATA_SOURCES[currentSource].label.replace('📡 数据源: ', '')}`);
            }

            // ==================== 获取代理数据 ====================
            async function fetchProxies() {
                const listContainer = document.getElementById('proxy-list');
                const statusSpan = document.getElementById('statusText');

                statusSpan.innerHTML = '🔄 同步中...';

                // 骨架屏
                listContainer.className = 'space-y-3';
                listContainer.innerHTML = Array(4).fill(0).map(() => `
                    <div class="shimmer h-[74px] rounded-xl border border-white/5"></div>
                `).join('');

                try {
                    // ===== MTProto 数据源 =====
                    if (currentPage === 'mtproto') {
                        const resp = await fetch('https://seep.eu.org/https://www.mtproto.shop/proxies.json');
                        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                        const data = await resp.json();

                        proxyItems = (data.proxies || []).map((p, index) => ({
                            id: index,
                            url: p.link,
                            status: 'idle',
                            latency: p.ping || null,
                            server: p.server,
                            port: p.port,
                            location: p.location,
                            flag: p.flag,
                            speed: p.speed,
                            secret: p.secret,
                            tgLink: p.link,
                            protocol: 'MTPROTO'
                        }));

                        statusSpan.innerHTML = `🟢 节点可用: ${proxyItems.length}`;
                        renderProxyNodes(proxyItems);
                        updateStats();
                        return;
                    }

                    // ===== SOCKS5 / HTTP 数据源 =====
                    const url = DATA_SOURCES[currentSource].url;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const text = await response.text();

                    const lines = text.split('\n');
                    const proxyUrls = [];

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || trimmed.startsWith('#')) continue;
                        const match = trimmed.match(/^(socks5|http|https):\/\/[^\s:]+:\d+/i);
                        if (match) proxyUrls.push(match[0]);
                    }

                    if (proxyUrls.length === 0) throw new Error('未匹配到任何代理节点');

                    proxyItems = proxyUrls.map((url, index) => ({
                        id: index,
                        url: url,
                        status: 'idle',
                        latency: null,
                        server: extractServer(url),
                        port: extractPort(url),
                        tgLink: convertToTgLink(url),
                        protocol: getProtocolLabel(url)
                    }));

                    statusSpan.innerHTML = `🟢 节点可用: ${proxyItems.length}`;
                    renderProxyNodes(proxyItems);
                    updateStats();

                } catch (error) {
                    console.error('获取代理失败:', error);
                    statusSpan.innerHTML = '🔴 同步失败';
                    listContainer.innerHTML = `
                        <div class="bg-red-500/5 rounded-xl p-6 text-center border border-red-500/10">
                            <i class="fas fa-circle-exclamation text-red-400 text-xl mb-1.5 block"></i>
                            <p class="text-xs font-semibold text-slate-300">无法加载节点数据</p>
                            <p class="text-[11px] text-slate-500 mt-0.5">${error.message || '网络线路受阻'}</p>
                            <button onclick="fetchProxies()" class="mt-3 text-[11px] font-bold bg-white/5 hover:bg-white/10 px-4 py-1.5 rounded-lg border border-white/10 transition-all">尝试重新连接</button>
                        </div>
                    `;
                }
            }

            // ==================== 工具函数 ====================
            function extractServer(url) {
                try { return new URL(url).hostname; } catch {
                    const m = url.match(/\/\/([^:]+):/);
                    return m ? m[1] : 'Unknown';
                }
            }
            function extractPort(url) {
                try { return new URL(url).port || '80'; } catch {
                    const m = url.match(/:(\d+)(?:\?|$)/);
                    return m ? m[1] : '80';
                }
            }
            function convertToTgLink(socksUrl) {
                if (!socksUrl.startsWith('socks5://')) return socksUrl;
                const url = socksUrl.replace(/^socks5:\/\//i, '');
                const [hostport] = url.split('?');
                const [server, port] = hostport.split(':');
                return `tg://socks?server=${encodeURIComponent(server)}&port=${encodeURIComponent(port)}&user=${encodeURIComponent('TG频道@stymei')}&pass=${encodeURIComponent('TG频道@stymei')}`;
            }
            function getProtocolLabel(url) {
                if (url.startsWith('socks5://')) return 'SOCKS5';
                if (url.startsWith('https://')) return 'HTTPS';
                if (url.startsWith('http://')) return 'HTTP';
                return 'UNKNOWN';
            }
            function getStatusBadge(status) {
                const map = {
                    'idle': { label: '待测', class: 'idle' },
                    'checking': { label: '检测中', class: 'checking' },
                    'valid': { label: '✓ 可用', class: 'valid' },
                    'invalid': { label: '✗ 失效', class: 'invalid' }
                };
                return map[status] || map['idle'];
            }

            // ==================== 渲染 ====================
            function renderProxyNodes(items) {
                const list = document.getElementById('proxy-list');

                let filtered = items;
                if (currentPage === 'socks5') {
                    filtered = items.filter(i => i.url.startsWith('socks5://'));
                } else if (currentPage === 'http') {
                    filtered = items.filter(i => i.url.startsWith('http://') || i.url.startsWith('https://'));
                } else {
                    filtered = items.filter(i => i.protocol === 'MTPROTO');
                }

                // MTProto 页面使用浅色背景
                if (currentPage === 'mtproto') {
                    list.className = 'grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-100 p-4 rounded-2xl';
                } else {
                    list.className = 'space-y-3';
                }

                if (!filtered.length) {
                    list.innerHTML = `<div class="text-center py-8 text-xs text-slate-500">暂无节点</div>`;
                    return;
                }

                list.innerHTML = filtered.map((item, idx) => {
                    const displayIp = item.server.length > 22 ? item.server.substring(0, 20) + '...' : item.server;
                    const statusBadge = getStatusBadge(item.status);
                    const isMtproto = item.protocol === 'MTPROTO';

                    // ===== MTProto 卡片样式 =====
                    if (isMtproto) {
                        const host = item.server;
                        const deepLink = item.tgLink;

                        let mtStatusBadge = `<span class="bg-emerald-50 text-emerald-600 border border-emerald-200 text-xs px-2 py-0.5 rounded-md font-medium">在线</span>`;
                        if (item.status === 'invalid') {
                            mtStatusBadge = `<span class="bg-rose-50 text-rose-600 border border-rose-200 text-xs px-2 py-0.5 rounded-md font-medium">离线</span>`;
                        }

                        return `
                            <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm mtproto-card transition duration-200 flex flex-col justify-between" data-id="${item.id}">
                                <div>
                                    <div class="flex items-center justify-between mb-3">
                                        <div class="flex items-center gap-2 min-w-0">
                                            <span class="text-xl">${item.flag || '🌐'}</span>
                                            <h3 class="font-bold text-slate-800 text-md truncate max-w-[160px]">${item.location || host}</h3>
                                        </div>
                                        <div class="flex items-center gap-1.5 flex-shrink-0">
                                            ${mtStatusBadge}
                                            <span class="text-xs font-mono text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded">${item.latency || 'N/A'}</span>
                                        </div>
                                    </div>

                                    <div class="space-y-1 text-xs font-mono text-slate-500 bg-slate-50 p-2.5 rounded-xl mb-4 border border-slate-100">
                                        <div class="flex justify-between"><span class="text-slate-400">服务器:</span> <span class="text-slate-700 truncate max-w-[180px]">${host}</span></div>
                                        <div class="flex justify-between"><span class="text-slate-400">端　口:</span> <span class="text-slate-700">${item.port}</span></div>
                                        <div class="flex justify-between"><span class="text-slate-400">密　钥:</span> <span class="text-slate-700 truncate max-w-[150px]" title="${item.secret || ''}">${item.secret || ''}</span></div>
                                    </div>
                                </div>

                                <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100 text-xs">
                                    <a href="${deepLink}" class="bg-sky-500 hover:bg-sky-600 text-white font-medium py-2 rounded-lg text-center transition flex items-center justify-center gap-1">
                                        <i class="fa-solid fa-bolt"></i> 连接
                                    </a>
                                    <button onclick="copyRawLink(event, '${deepLink}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 rounded-lg transition text-center cursor-pointer flex items-center justify-center gap-1">
                                        <i class="fa-solid fa-copy"></i> 复制
                                    </button>
                                    <button onclick="showQRCode('${deepLink}', '${(item.location || '').replace(/'/g, "\\'")}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 rounded-lg transition text-center cursor-pointer flex items-center justify-center gap-1">
                                        <i class="fa-solid fa-qrcode"></i> 二维码
                                    </button>
                                </div>
                            </div>
                        `;
                    }

                    // ===== SOCKS5 / HTTP 卡片样式 =====
                    return `
                        <div class="proxy-item group bg-white/[0.02] hover:bg-white/[0.05] border border-white/5 hover:border-brand-500/30 rounded-xl p-3.5 flex items-center justify-between transition-all duration-300" data-id="${item.id}">
                            <div class="flex items-center gap-3 min-w-0">
                                <div class="w-9 h-9 rounded-lg bg-slate-800 border border-white/5 flex items-center justify-center font-mono text-xs font-bold text-slate-400">
                                    ${String(idx + 1).padStart(2, '0')}
                                </div>
                                <div class="min-w-0">
                                    <div class="flex items-center gap-1.5 flex-wrap">
                                        <span class="text-[10px] font-extrabold tracking-wider text-slate-500 uppercase">${item.protocol}</span>
                                        <span class="w-1 h-1 rounded-full bg-cyan-400"></span>
                                        <span class="text-[9px] font-mono text-slate-400">PORT:${item.port}</span>
                                        <span class="status-badge ${statusBadge.class}">${statusBadge.label}</span>
                                        ${item.latency ? `<span class="text-[9px] text-slate-500">${item.latency}</span>` : ''}
                                    </div>
                                    <p class="text-sm font-mono font-bold text-slate-200 mt-0.5 truncate select-all">${displayIp}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="checkSingleProxy(${item.id})" class="p-2 text-slate-400 hover:text-slate-200 bg-white/0 hover:bg-white/5 rounded-lg border border-transparent hover:border-white/5 transition-all" title="检测此节点">
                                    <i class="fas fa-sync text-xs ${item.status === 'checking' ? 'fa-spin' : ''}"></i>
                                </button>
                                <button onclick="copyRawLink(event, '${item.tgLink}')" class="p-2 text-slate-400 hover:text-slate-200 bg-white/0 hover:bg-white/5 rounded-lg border border-transparent hover:border-white/5 transition-all" title="复制链接">
                                    <i class="far fa-copy text-xs"></i>
                                </button>
                                <button onclick="connectProxy('${item.tgLink.replace(/'/g, "\\'")}')" class="px-3.5 py-1.5 text-xs font-bold bg-brand-500 hover:bg-brand-600 text-white rounded-lg shadow-lg shadow-brand-500/10 flex items-center gap-1 transition-all active:scale-95">
                                    <span>连接</span>
                                    <i class="fas fa-chevron-right text-[10px] opacity-70"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            function updateStats() {
                let filtered = proxyItems;
                if (currentPage === 'socks5') {
                    filtered = proxyItems.filter(i => i.url.startsWith('socks5://'));
                } else if (currentPage === 'http') {
                    filtered = proxyItems.filter(i => i.url.startsWith('http://') || i.url.startsWith('https://'));
                } else {
                    filtered = proxyItems.filter(i => i.protocol === 'MTPROTO');
                }
                document.getElementById('proxyCount').textContent = filtered.length;
                document.getElementById('validCount').textContent = filtered.filter(p => p.status === 'valid').length;
            }

            // ==================== 检测 ====================
            async function checkSingleProxy(id) {
                const item = proxyItems.find(p => p.id === id);
                if (!item || item.status === 'checking') return;
                item.status = 'checking';
                renderProxyNodes(proxyItems);
                updateStats();
                try {
                    const start = performance.now();
                    const ctrl = new AbortController();
                    const tid = setTimeout(() => ctrl.abort(), 5000);
                    await fetch('https://httpbin.org/delay/1', { signal: ctrl.signal });
                    clearTimeout(tid);
                    item.status = 'valid';
                    item.latency = Math.round(performance.now() - start) + 'ms';
                    showToast(`✅ 节点 ${item.server} 可用`);
                } catch (e) {
                    item.status = 'invalid';
                    showToast(`❌ 节点 ${item.server} 不可用`);
                }
                renderProxyNodes(proxyItems);
                updateStats();
            }

            async function checkAllProxies() {
                if (isCheckingAll) return;
                isCheckingAll = true;
                const btn = document.getElementById('checkAllBtn');
                btn.innerHTML = '<span class="checking-spinner"></span><span>检测中...</span>';
                btn.disabled = true;
                const target = proxyItems.filter(i => currentPage === 'socks5' ? i.url.startsWith('socks5://') : currentPage === 'http' ? (i.url.startsWith('http://') || i.url.startsWith('https://')) : i.protocol === 'MTPROTO');
                await Promise.allSettled(target.map(i => checkSingleProxy(i.id)));
                isCheckingAll = false;
                btn.innerHTML = '<i class="fas fa-heartbeat text-[10px]"></i><span>检测全部</span>';
                btn.disabled = false;
                showToast(`✅ 检测完成`);
            }

            // ==================== UI ====================
            function showToast(msg) {
                const t = document.getElementById('toast');
                document.getElementById('toast-msg').innerText = msg;
                t.classList.remove('opacity-0', '-translate-y-2');
                t.classList.add('opacity-100', 'translate-y-0');
                clearTimeout(t._hideTimer);
                t._hideTimer = setTimeout(() => {
                    t.classList.remove('opacity-100', 'translate-y-0');
                    t.classList.add('opacity-0', '-translate-y-2');
                }, 2500);
            }
            window.copyRawLink = function(event, link) {
                event.stopPropagation();
                navigator.clipboard.writeText(link);
                showToast('已复制到剪贴板');
            };
            window.connectProxy = function(tgUrl) {
                navigator.clipboard.writeText(tgUrl);
                showToast('正在呼叫 Telegram...');
                setTimeout(() => { window.location.href = tgUrl; }, 400);
            };
            window.checkSingleProxy = checkSingleProxy;
            window.fetchProxies = fetchProxies;

            // ==================== 二维码 ====================
            window.showQRCode = function(link, name) {
                const qrContainer = document.getElementById('qrcode');
                qrContainer.innerHTML = '';
                document.getElementById('qrTitle').innerText = (name || '') + ' - 节点扫描';
                document.getElementById('qrLink').href = link;

                new QRCode(qrContainer, {
                    text: link,
                    width: 180,
                    height: 180,
                    colorDark: "#0f172a",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });

                const modal = document.getElementById('qrModal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            };

            window.closeQRModal = function() {
                const modal = document.getElementById('qrModal');
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            };

            // ==================== 事件绑定 ====================
            switchPageBtn.addEventListener('click', () => {
                const order = ['socks5', 'http', 'mtproto'];
                const next = order[(order.indexOf(currentPage) + 1) % order.length];
                switchPage(next);
            });
            tabSocks5.addEventListener('click', () => switchPage('socks5'));
            tabHttp.addEventListener('click', () => switchPage('http'));
            tabMtproto.addEventListener('click', () => switchPage('mtproto'));
            sourceLabel.addEventListener('click', switchDataSource);
            document.getElementById('refreshBtn').addEventListener('click', (e) => { e.preventDefault(); fetchProxies(); });
            document.getElementById('checkAllBtn').addEventListener('click', checkAllProxies);

            sourceLabel.textContent = DATA_SOURCES[currentSource].label;
            fetchProxies();
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            if (document.getElementById('main-content').style.display === 'flex') initApp();
        }
    </script>
</body>
</html>
